    <title>Jose Benjumea</title>
    <!-- Restaura el scroll antes de que React monte (evita saltar al top al recargar) -->
    <script>
      (function () {
        try {
          if ("scrollRestoration" in history) history.scrollRestoration = "manual";
          var raw = sessionStorage.getItem("portfolio.scrollY");
          if (!raw) return;
          var y = parseInt(raw, 10);
          if (!y || y <= 0) return;
          var go = function () { window.scrollTo(0, y); };
          go();
          document.addEventListener("DOMContentLoaded", go);
          window.addEventListener("load", go);
        } catch (e) {}
      })();
    </script>
